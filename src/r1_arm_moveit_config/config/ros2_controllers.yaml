# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # 硬件组件初始状态设为 unconfigured:启动时不强制激活 R1ArmSystem。
    # 真臂未连接时,spawner 激活控制器会优雅报错,而不是 controller_manager
    # 构造函数抛异常导致整个节点崩溃;硬件在 spawner 需要时自动 configure+activate。
    hardware_components_initial_state:
      unconfigured:
        - R1ArmSystem

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


joint_trajectory_controller:
  ros__parameters:
    joints:
      - J1
      - J2
      - J3
      - J4
      - J5
      - J6
      - J7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

joint_state_broadcaster:
  ros__parameters:
    joints:
      - J1
      - J2
      - J3
      - J4
      - J5
      - J6
      - J7
    state_interfaces:
      - position
      - velocity


      